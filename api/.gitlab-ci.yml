docker-image-api:
  extends: .build-docker
  variables:
    IMAGE: "${REGISTRY}focus-marches-v2/api"
    BUILD_CONTEXT: "api/."

api-qa:
  stage: 🔍 build-quality
  image: ghcr.io/astral-sh/uv:0.12.23-python3.14-alpine3.23@sha256:5bad981cb914722a38eb1f9de538194f14d03c5f104d3b30f19239327d57eb50
  variables:
    FORCE_COLOR: true
  script:
    - apk add build-base mariadb mariadb-dev
    - cd api
    - uv sync
    - unset DOCKER_AUTH_CONFIG # XXX: On ignore la configuration au sein des tests du à une incompatibilité avec testcontainers
    - uv run pytest --cov-report xml:cov.xml --cov-report=term
    - uv run ruff format --check || touch failed
    - uv run ruff check || touch failed
    - uv run ty check || touch failed
    - '[ ! -e failed ] || ( echo "Ruff et/ou ty ont remonté des erreurs, voir les logs précédents"; exit 1 )'
  coverage: '/TOTAL.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: api/cov.xml
