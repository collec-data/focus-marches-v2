server {
    listen 80;
    root  /usr/share/nginx/html;
    include /etc/nginx/mime.types;

    # "no-cache" par défaut (contrairement au nom, le navigateur met en cache mais
    # revalide systèmatiquement auprès du serveur qui peut retourner 304 Not modified).
    add_header Cache-Control "no-cache";

    # On active gzip pour les textes.
    gzip on;
    gzip_types application/javascript application/json image/svg+xml text/css;
    gzip_min_length 1000;

    location / {
        try_files $uri $uri/ /index.html =404;
    }

    location = /settings.json {
        try_files /settings.json =404;
    }

    location /health {
        add_header Content-Type text/plain;
        return 200 "UP";
    }
}
