front-build:
  image: ghcr.io/pnpm/pnpm:12.14.0@sha256:71202ae73719148f6b6e129ca1e9fa3ceabbc9a037dc34800715606f2b5290a1
  stage: 🔍 build-quality
  variables:
    PNPM_CONFIG_VERIFY_DEPS_BEFORE_RUN: false
  script:
    - cd front
    - pnpm runtime set node 24.21.0 -g
    - pnpm ci
    - pnpm run format-check
    - pnpm run lint-check
    - pnpm run test
    - pnpm run build
    - >
      if [[ "$CI_COMMIT_TAG" == "" ]]; then
        echo "TAG VIDE";
        VERSION=${CI_COMMIT_SHA:0:8};
      else
        echo "TAG PAS VIDE";
        VERSION=${CI_COMMIT_REF_NAME};
      fi
    - echo ${VERSION}
    # mise à jour du fichier git-version.json avec la version du commit
    #- sed -i "s/dev/${VERSION}/g" public/git-version.json
    - pnpm run build
  coverage: '/All files[^|]*\|[^|]*\s+([\d\.]+)/'
  artifacts:
    expire_in: 15 mins
    paths:
      - front/dist/
    reports:
      coverage_report:
        coverage_format: cobertura
        path: front/coverage/cobertura-coverage.xml

docker-image-front:
  extends: .build-docker
  variables:
    IMAGE: "${REGISTRY}focus-marches-v2/front"
    BUILD_CONTEXT: "front/."
