name: Tests

on:
  push:
  pull_request:

jobs:
  front:
    name: Front
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          version: 12.10.0
          package-json-file: front/package.json

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: front/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm ci

      - name: Check formatting
        run: pnpm run format-check

      - name: Run linter
        run: pnpm run lint-check

      - name: Run tests
        run: pnpm run test

  api:
    name: API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential libmariadb-dev mariadb-client

      - name: Install Python dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest --cov-report xml:cov.xml --cov-report=term

      - name: Check formatting
        run: uv run ruff format --check --diff

      - name: Run linter
        run: uv run ruff check

      - name: Run type checks
        run: uv run ty check
